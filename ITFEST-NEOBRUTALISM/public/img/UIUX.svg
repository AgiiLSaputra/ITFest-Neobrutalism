<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ilustrasi mockup antarmuka UI/UX">
  <rect width="800" height="450" fill="#f5f0e1"/>

  <!-- browser window -->
  <g stroke="#000" stroke-width="6">
    <rect x="60" y="50" width="600" height="340" fill="#fffdf5"/>
    <rect x="60" y="50" width="600" height="56" fill="#ffd93d"/>
    <line x1="60" y1="106" x2="660" y2="106"/>
    <circle cx="96" cy="78" r="10" fill="#ff6b9d"/>
    <circle cx="128" cy="78" r="10" fill="#4ecdc4"/>
    <circle cx="160" cy="78" r="10" fill="#000" fill-opacity=".15"/>
    <rect x="200" y="66" width="380" height="26" fill="#fffdf5"/>
  </g>

  <!-- sidebar -->
  <g stroke="#000" stroke-width="5">
    <rect x="84" y="130" width="120" height="236" fill="#4ecdc4"/>
    <rect x="100" y="150" width="88" height="22" fill="#000"/>
    <rect x="100" y="186" width="88" height="16" fill="#fffdf5"/>
    <rect x="100" y="214" width="88" height="16" fill="#fffdf5"/>
    <rect x="100" y="242" width="66" height="16" fill="#fffdf5"/>
  </g>

  <!-- content blocks -->
  <g stroke="#000" stroke-width="5">
    <rect x="224" y="130" width="412" height="70" fill="#ff6b9d"/>
    <rect x="240" y="150" width="240" height="14" fill="#000"/>
    <rect x="240" y="172" width="160" height="12" fill="#fffdf5"/>
    <rect x="224" y="216" width="196" height="150" fill="#ffd93d"/>
    <rect x="440" y="216" width="196" height="150" fill="#fffdf5"/>
    <rect x="462" y="240" width="60" height="60" fill="#4ecdc4"/>
    <rect x="536" y="240" width="78" height="16" fill="#000"/>
    <rect x="536" y="266" width="60" height="12" fill="#000" fill-opacity=".35"/>
    <rect x="462" y="318" width="152" height="30" fill="#ff6b9d"/>
  </g>

  <!-- floating component card -->
  <g stroke="#000" stroke-width="5">
    <rect x="540" y="300" width="180" height="110" fill="#ffd93d"/>
    <rect x="560" y="322" width="100" height="14" fill="#000"/>
    <rect x="560" y="348" width="140" height="10" fill="#000" fill-opacity=".35"/>
    <rect x="560" y="372" width="84" height="26" fill="#4ecdc4"/>
  </g>

  <!-- cursor -->
  <g transform="translate(390 290)">
    <path d="M0 0 L0 54 L14 41 L24 62 L36 56 L26 36 L44 34 Z" fill="#000" stroke="#fffdf5" stroke-width="4"/>
  </g>

  <!-- measuring guides -->
  <g stroke="#000" stroke-width="3" stroke-dasharray="10 8">
    <line x1="224" y1="384" x2="636" y2="384"/>
    <line x1="648" y1="130" x2="648" y2="366"/>
  </g>
</svg>
